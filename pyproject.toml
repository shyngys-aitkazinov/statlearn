[project]
name = "statlearn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Shyngys Aitkazinov", email = "chikaphys9@gmail.com" }]
dependencies = []

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "mypy>=1.15.0,<2.0.0",
    "pre-commit>=4.2.0,<5.0.0",
    "ruff>=0.11.2,<1.0.0",
]

[tool.ruff]
line-length = 120
force-exclude = true

[tool.ruff.lint]
select = [
    "E",  # basic style errors (pycodestyle)
    "F",  # correctness (Pyflakes)
    "I",  # import-ordering (isort-style)
    "UP", # pyupgrade modernisations
    "D",  # docstring conventions (pydocstyle)
]

extend-ignore = [
    "D100",
    "D103",
    "D104",
    "D202",
    "D205",
    "D212",
    "D213",
    "D415",
    "D417",
    "D102",
    "D107",
    "D105",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
follow_imports = "skip"
ignore_missing_imports = true   # Don't fail on 3rd-party libs at first
disallow_untyped_defs = true    # Force hints on new functions
disallow_incomplete_defs = true # Catch missing return types
no_implicit_optional = true     # Catch silent Optional[T]
